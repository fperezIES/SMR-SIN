<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pasillos fríos y calientes en un CPD">
<title>Pasillos fríos y calientes en un CPD</title>
<defs>
<marker id="fc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0288d1"/></marker>
<marker id="fh" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect x="1" y="1" width="778" height="468" rx="14" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="390" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#263238">Pasillos fríos y calientes</text>
<!-- Falso techo y falso suelo -->
<rect x="20" y="58" width="740" height="42" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<rect x="20" y="360" width="740" height="52" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="610" y="93" text-anchor="middle" font-size="13" fill="#546e7a">Falso techo: retorno del aire caliente</text>
<text x="430" y="404" text-anchor="middle" font-size="13" fill="#546e7a">Falso suelo: impulsión del aire frío</text>
<!-- Rejilla de retorno y baldosas perforadas -->
<rect x="390" y="96" width="80" height="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="155" y="356" width="60" height="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="650" y="356" width="60" height="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="5 3"/>
<!-- Climatizador -->
<rect x="30" y="100" width="80" height="260" rx="6" fill="#f5f7f8" stroke="#546e7a" stroke-width="2"/>
<text x="70" y="235" text-anchor="middle" font-size="15" font-weight="500" fill="#263238" transform="rotate(-90 70 230)">Climatizador</text>
<!-- Racks -->
<g fill="#eceff1" stroke="#90a4ae" stroke-width="1">
<rect x="260" y="170" width="100" height="190" rx="4" fill="#f5f7f8" stroke="#546e7a" stroke-width="2"/>
<rect x="268" y="182" width="84" height="14"/><rect x="268" y="202" width="84" height="14"/><rect x="268" y="222" width="84" height="14"/><rect x="268" y="242" width="84" height="14"/>
<rect x="268" y="262" width="84" height="14"/><rect x="268" y="282" width="84" height="14"/><rect x="268" y="302" width="84" height="14"/><rect x="268" y="322" width="84" height="14"/>
<rect x="500" y="170" width="100" height="190" rx="4" fill="#f5f7f8" stroke="#546e7a" stroke-width="2"/>
<rect x="508" y="182" width="84" height="14"/><rect x="508" y="202" width="84" height="14"/><rect x="508" y="222" width="84" height="14"/><rect x="508" y="242" width="84" height="14"/>
<rect x="508" y="262" width="84" height="14"/><rect x="508" y="282" width="84" height="14"/><rect x="508" y="302" width="84" height="14"/><rect x="508" y="322" width="84" height="14"/>
</g>
<g font-size="11" fill="#546e7a">
<text x="262" y="162">Frontal</text><text x="358" y="162" text-anchor="end">Trasera</text>
<text x="502" y="162">Trasera</text><text x="598" y="162" text-anchor="end">Frontal</text>
</g>
<!-- Nombres de pasillos -->
<g font-size="16" font-weight="700" text-anchor="middle">
<text x="185" y="135" fill="#01579b">Pasillo frío</text>
<text x="430" y="318" fill="#b71c1c">Pasillo</text>
<text x="430" y="338" fill="#b71c1c">caliente</text>
<text x="680" y="135" fill="#01579b">Pasillo frío</text>
</g>
<!-- Aire frío -->
<g fill="none" stroke="#0288d1" stroke-width="6" stroke-linejoin="round">
<path d="M70,300 V378 H680 V300" marker-end="url(#fc)"/>
<path d="M185,378 V300" marker-end="url(#fc)"/>
<path d="M200,260 H250" marker-end="url(#fc)"/>
<path d="M660,260 H610" marker-end="url(#fc)"/>
</g>
<!-- Aire caliente -->
<g fill="none" stroke="#c62828" stroke-width="6" stroke-linejoin="round">
<path d="M365,250 H410 V114" marker-end="url(#fh)"/>
<path d="M495,250 H450 V114" marker-end="url(#fh)"/>
<path d="M430,74 H70 V116" marker-end="url(#fh)"/>
</g>
<!-- Leyenda -->
<line x1="240" y1="444" x2="280" y2="444" stroke="#0288d1" stroke-width="6"/>
<text x="290" y="449" font-size="14" fill="#263238">Aire frío</text>
<line x1="420" y1="444" x2="460" y2="444" stroke="#c62828" stroke-width="6"/>
<text x="470" y="449" font-size="14" fill="#263238">Aire caliente</text>
</svg>
