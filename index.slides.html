### Curso 2026-2027

## Duración y contenidos

--

## Módulo: Seguridad informática

- Duración: **133** horas
	- 4 horas por semana
	- **22 semanas** (**2 trimestres**) => 22semanas x 4h/semana = **88** horas
	- 2 semanas de exámenes
	- Resto 133-88 = 45 horas: **Formación en empresa.**


--

## Unidades didácticas

| Tarea             | Porcentaje | Requisito |
| ----------------- | ---------- | --------- |
| Primer trimestre  | 50%        | >=5       |
| Segundo trimestre | 50%        | >=5       |



| **Unidad de Trabajo (UT)** | **Título**                                | **Semanas** | **Horas** | **RA asociados** |
| -------------------------- | ----------------------------------------- | ----------- | --------- | ---------------- |
| **UT 1**                   | Introducción a la Seguridad y Marco Legal | 2           | 8 h       | RA 5             |
| **UT 2**                   | Seguridad pasiva y almacenamiento         | 3           | 12 h      | RA 1             |
| **UT 3**                   | Criptografía                              | 5           | 20 h      | RA 2             |
| **UT 4**                   | Fortificación de Hosts                    | 4           | 16 h      | RA 3             |
| **UT 5**                   | Seguridad en Redes                        | 6           | 24 h      | RA 4             |
| **TOTAL**                  |                                           | **20**      | **80 h**  |                  |



--

## Contenidos principales

 - **Conceptos** relacionados con seguridad de la información.
 - Introducción a la **gestión de riesgos**.
 - **Normativa** relacionada con la ciberseguridad
 - Seguridad Física.
 - Almacenamiento.
 - Fortificación de Hosts.
 - Fortificación de Redes.
 - Acceso remoto seguro.
 - Seguridad perimetral.


---

<!-- .slide: data-background="#98c1d9" -->
## Metodología

--

## Metodología

- Los contenidos y la planificación se publicará en la Clase Virtual (Aules)
- Se tendrán que entregar algunos ejercicios obligatorios cada trimestre.
- Adicionalmente puede haber ejercicios opcionales.
- Habrá ejercicios de clase que no serán corregidos con puntuación
	- Se publicarán soluciones de ejemplo
	- **Su contenido entre para el examen**

--
## Ejercicios

- Habrá ejercicios de clase que no habrá que entregar
	- Se publicarán soluciones de ejemplo
- Habrá varios ejercicios obligatorios por trimestre
	- Habrá que entregarlos para aprobar el módulo
	- Habrá que defenderlos presencialmente ante el profesor
- Pueden haber ejercicios opcionales
	- Pueden subir la nota hasta un punto.

--

## Exámenes

- Evaluación **Continua**: Uno o varios exámenes por trimestre

- Convocatorias oficiales:
	- **Ordianaria**: al final del segundo trimestre
	- **Extraordinaria**: en junio


--

## Exámenes y recuperaciones

- Los exámenes trimestrales se recuperarán en la Convocatoria Ordinaria
- Convocatoria **Ordinaria**: al final de segundo trimestre
	- Se guardará la nota por trimestres.
	- **Necesario aprobar para realizar FCT**
- Convocatoria **Extraordinaria**: En Junio
	- Entra todo el temario, no se guardan parciales

## Temporarilzación

--
## Primer trimestre



* UD1 - Introducción a la seguridad informática 
	* Introducción a la seguridad informática
	* Vulnerabilidades y Amenazas
	* Auditorías: estándares y gestión de riesgos
	* Normativa sobre Ciberseguridad

--

*  UD2 - Seguridad pasiva
	- Seguridad física
	- Almacenamiento
	- RAID
	- Copias de seguridad
	- Eliminación y recuperación de datos

--

* UD3 - Criptografía
	- Funciones Hash
	- Cifrado simétrico
	- Cifrado asimétrico
	- Firma digital
	- Certificados digitales: Infraestructura de clave pública
	- Cifrado híbrido

--

* UD4 - Fortificación hosts
	- Control de acceso
		- Contraseñas
		- Biometría
	- Bios / Gestores de arranque
	- Cifrado de discos
	- Actualización y verificación de software
	- Monitorización
	- Malware

---

## Segundo trimestre



* UD5 - Alta disponibilidad
	* Redundancia Hardware
	* Sistemas e alimentación ininterrumpida
	* Balanceo de carga
	- Virtualización y Contenedores

--

* UD6 - Seguridad en redes
	* IDS
	- SSL/TLS
	- WLAN
	- SSH
	- VPN

--
*  UD 7 - Seguridad perimetral 
	- Firewall
	- Proxy
